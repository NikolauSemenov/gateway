definitions:
  auth.LoginRequest:
    properties:
      login:
        type: string
      password:
        type: string
    type: object
  auth.LoginResponse:
    properties:
      access_token:
        type: string
      last_name:
        type: string
      token_type:
        type: string
      user_id:
        type: integer
      user_name:
        type: string
    type: object
  auth.RegisterRequest:
    properties:
      email:
        type: string
      last_name:
        type: string
      login:
        type: string
      password:
        type: string
      user_name:
        type: string
    type: object
  auth.SendEmailCodeRequest:
    properties:
      email:
        type: string
    type: object
  auth.VerifyEmailCodeRequest:
    properties:
      code:
        type: string
      email:
        type: string
    type: object
  auth.VerifyEmailCodeResponse:
    properties:
      access_token:
        type: string
      last_name:
        type: string
      token_type:
        type: string
      user_id:
        type: integer
      user_name:
        type: string
    type: object
  note_flow.CommentsRequest:
    properties:
      comment_id:
        type: integer
      text:
        type: string
      user_id:
        type: integer
      user_name:
        type: string
    type: object
  note_flow.CreateNoteRequest:
    properties:
      content:
        type: string
      full_name:
        type: string
      title:
        type: string
    type: object
  note_flow.CreateNoteResponse:
    properties:
      id:
        type: integer
    type: object
  note_flow.LikeNoteRequest:
    properties:
      note_id:
        type: integer
    type: object
  note_flow.LikeNoteResponse:
    properties:
      id:
        type: integer
    type: object
  note_flow.NoteCommentsRequest:
    properties:
      note_id:
        type: integer
      text:
        type: string
      user_full_name:
        type: string
    type: object
  note_flow.NoteCommentsResponse:
    properties:
      Id:
        type: integer
    type: object
  note_flow.NotesResponse:
    properties:
      comments:
        items:
          $ref: '#/definitions/note_flow.CommentsRequest'
        type: array
      content:
        type: string
      created_at:
        type: string
      full_name:
        type: string
      id:
        type: integer
      likes:
        type: integer
      title:
        type: string
      user_id:
        type: integer
    type: object
info:
  contact: {}
  description: Сервис для проксирования http запросов.
  title: Gateway
  version: "1.0"
paths:
  /gateway/api/v1/auth/login:
    post:
      description: Проиксирует запрос по пути /login
      parameters:
      - description: Данные запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.LoginRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.LoginResponse'
        "400":
          description: Неверный запрос
          schema:
            type: string
        "422":
          description: Ошибка валидации
          schema:
            type: string
      summary: Аутентификация пользователя
      tags:
      - auth
  /gateway/api/v1/auth/logout:
    delete:
      description: Проксирует запрос по пути /logout
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      responses:
        "204":
          description: OK
          schema:
            type: string
        "422":
          description: Ошибка валидации
          schema:
            type: string
      summary: Выход пользователя
      tags:
      - auth
  /gateway/api/v1/auth/register:
    post:
      description: Проксирует запрос по пути /register
      parameters:
      - description: Данные запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.RegisterRequest'
      responses:
        "201":
          description: Created
          schema:
            type: string
        "400":
          description: Неверный запрос
          schema:
            type: string
        "422":
          description: Ошибка валидации
          schema:
            type: string
      summary: Регистрация нового пользователя
      tags:
      - auth
  /gateway/api/v1/auth/send-email-code:
    post:
      description: Проксирует запрос по пути /send-email-code
      parameters:
      - description: Данные запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.SendEmailCodeRequest'
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Неверный запрос
          schema:
            type: string
        "422":
          description: Ошибка валидации
          schema:
            type: string
      summary: Отправка кода на email
      tags:
      - auth
  /gateway/api/v1/auth/verify:
    get:
      description: Проксирует запрос по пути /verify
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            type: string
        "422":
          description: Ошибка валидации
          schema:
            type: string
      summary: Проверка верификации пользователя
      tags:
      - auth
  /gateway/api/v1/auth/verify-email-code:
    put:
      description: Проксирует запрос по пути /verify-email-code
      parameters:
      - description: Данные запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/auth.VerifyEmailCodeRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.VerifyEmailCodeResponse'
        "400":
          description: Неверный запрос
          schema:
            type: string
        "422":
          description: Ошибка валидации
          schema:
            type: string
      summary: Проверка кода, отправленного на email
      tags:
      - auth
  /gateway/api/v1/note-flow/note:
    post:
      description: Проксирует запрос по пути /note
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Данные запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/note_flow.CreateNoteRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/note_flow.CreateNoteResponse'
        "422":
          description: Ошибка валидации
          schema:
            type: string
      summary: Создать заметку
      tags:
      - note-flow
  /gateway/api/v1/note-flow/note/{note_id}:
    delete:
      description: Проксирует запрос по пути /note/{note_id}
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: ID заметки
        in: path
        name: note_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Неверный ID
          schema:
            type: string
        "422":
          description: Ошибка валидации
          schema:
            type: string
      summary: Удалить заметку
      tags:
      - note-flow
    get:
      description: Проксирует запрос по пути /note/{note_id}
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: ID заметки
        in: path
        name: note_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/note_flow.NotesResponse'
        "400":
          description: Неверный ID
          schema:
            type: string
        "422":
          description: Ошибка валидации
          schema:
            type: string
      summary: Получение заметки по ID
      tags:
      - note-flow
  /gateway/api/v1/note-flow/note/active:
    put:
      description: Проксирует запрос по пути /note/active
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: ID заметки
        in: query
        name: id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            type: string
        "422":
          description: Ошибка валидации
          schema:
            type: string
      summary: Пометить заметку как не активную
      tags:
      - note-flow
  /gateway/api/v1/note-flow/note/comment:
    post:
      description: Проксирует запрос по пути /note/comments
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Данные запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/note_flow.NoteCommentsRequest'
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/note_flow.NoteCommentsResponse'
        "422":
          description: Ошибка валидации
          schema:
            type: string
      summary: Создать комментарий
      tags:
      - Comments
  /gateway/api/v1/note-flow/note/comment/{comment_id}:
    delete:
      description: Проксирует запрос по пути /note/comment/{comment_id}
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: ID комментария
        in: path
        name: comment_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
          schema:
            type: string
        "400":
          description: Неверный ID
          schema:
            type: string
        "422":
          description: Ошибка валидации
          schema:
            type: string
      summary: Удалить комментарий
      tags:
      - Comments
  /gateway/api/v1/note-flow/note/like:
    post:
      description: Проксирует запрос по пути /note/like
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      - description: Данные запроса
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/note_flow.LikeNoteRequest'
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/note_flow.LikeNoteResponse'
        "400":
          description: Неверный запрос
          schema:
            type: string
        "422":
          description: Ошибка валидации
          schema:
            type: string
      summary: Лайкнуть заметку
      tags:
      - likes
  /gateway/api/v1/note-flow/notes:
    get:
      description: Проксирует запрос по пути /notes
      parameters:
      - description: Bearer token
        in: header
        name: Authorization
        required: true
        type: string
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/note_flow.NotesResponse'
        "422":
          description: Ошибка валидации
          schema:
            type: string
      summary: Получить все активные заметки
      tags:
      - note-flow
swagger: "2.0"
