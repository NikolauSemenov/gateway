apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: gateway:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: LOG_LEVEL
              value: "INFO"

            - name: ADDRESS
              value: "0.0.0.0:8000"
            - name: TIMEOUT
              value: "5s"
            - name: IDLE_TIMEOUT
              value: "60s"
            - name: API_PREFIX
              value: "gateway"
            - name: APP_VERSION
              value: "v1"
            - name: LIMIT_READ
              value: "65536"

            - name: AUTH_BASE_URL
              value: "http://auth:80/auth/api"
            - name: AUTH_V1_REGISTER
              value: "/v1/register"
            - name: AUTH_V1_LOGIN
              value: "/v1/login"
            - name: AUTH_V1_VERIFY
              value: "/v1/verify"
            - name: AUTH_V1_LOGOUT
              value: "/v1/logout"
            - name: AUTH_V1_SEND_EMAIL_CODE
              value: "/v1/send-email-code"
            - name: AUTH_V1_VERIFY_EMAIL
              value: "/v1/verify-email-code"

            - name: NOTE_FLOW_BASE_URL
              value: "http://note-flow:80/note-flow/api"
            - name: NOTE_FLOW_V1_NOTES
              value: "/v1/notes"
            - name: NOTE_FLOW_V1_NOTE
              value: "/v1/note"
            - name: NOTE_FLOW_V1_NOTE_ACTIVE
              value: "/v1/note/active"
            - name: NOTE_FLOW_V1_NOTE_LIKE
              value: "/v1/note/like"
            - name: NOTE_FLOW_V1_NOTE_COMMENT
              value: "/v1/note/comment"

          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /gateway/api/v1/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /gateway/api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
