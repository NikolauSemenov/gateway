apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gateway-ingress
  namespace: backend
spec:
  ingressClassName: nginx
  rules:
    - host: secret-network.local
      http:
        paths:
          - path: /gateway/api/v1
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 80
